name: Namyran Customer Stage APK | Phase 10

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-stage-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-debug:
    name: Validate and assemble Stage Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Validate Stage-only source
        run: python3 audit/check_stage_only.py

      - name: Validate Gradle build configuration
        run: python3 scripts/check_ci_configuration.py

      - name: Build Stage Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK structure and identity
        run: |
          set -euo pipefail
          python3 scripts/verify_stage_apk.py app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/debug/app-debug.apk
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.namyranservice.customer.stage'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish Stage Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Namyran-Customer-Stage-v0.2.2-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: customer-stage-build-diagnostics
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
