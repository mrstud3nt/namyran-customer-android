name: Namyran Customer Native Stage

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'audit/native-session-*.enc'
      - '.github/workflows/native-authorized-acceptance.yml'
      - 'scripts/await_authorized_native_session.py'
      - 'scripts/run_native_acceptance.py'
      - 'README_FA.md'

permissions:
  contents: read

concurrency:
  group: customer-stage-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage-debug:
    name: Validate and assemble Stage Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Validate Stage bridge PHP and behavior
        run: |
          php -l stage-adapter/namyran-customer-stage-bridge/namyran-customer-stage-bridge.php
          php stage-adapter/tests/bridge-test.php

      - name: Validate Stage-only source
        run: python3 audit/check_stage_only.py

      - name: Validate Gradle build configuration
        run: python3 scripts/check_ci_configuration.py

      - name: Run JVM unit tests and Android lint
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug

      - name: Build Stage Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Verify APK structure and identity
        run: |
          set -euo pipefail
          python3 scripts/verify_stage_apk.py app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/debug/app-debug.apk
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='ir.namyranservice.customer.stage'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt

      - name: Publish Stage Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Namyran-Customer-Stage-v0.3.3-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-stage-build-diagnostics
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

  emulator-smoke:
    name: Native Stage smoke on Android 15
    needs: stage-debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Namyran-Customer-Stage-v0.3.3-debug
          path: smoke-apk
      - name: Verify live Stage metadata before emulator
        run: python3 audit/probe_stage_readonly.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch, load live Stage catalog and check native navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/run_device_checks.py smoke-apk
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-smoke-evidence
          path: smoke-evidence/
          if-no-files-found: warn
