name: Customer Main Site Candidate
on:
  push:
    branches: [build/customer-main-candidate-20261121]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Test and lint main environment
        run: gradle --no-daemon --stacktrace -PnamyranEnvironment=production :app:testDebugUnitTest :app:lintDebug
      - name: Assemble main site candidate
        run: gradle --no-daemon --stacktrace -PnamyranEnvironment=production :app:assembleDebug
      - name: Verify main site identity and signature
        shell: bash
        run: |
          set -euo pipefail
          FILE=app/build/generated/source/buildConfig/debug/ir/namyranservice/customer/BuildConfig.java
          grep -F 'https://namyranservice.ir/wp-json/' "$FILE"
          if grep -E 'stage[.]namyranservice|clone2[.]namyranservice' "$FILE"; then exit 1; fi
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-identity.txt
          grep -F "package: name='ir.namyranservice.customer'" apk-identity.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > apk-signature.txt
          mkdir -p delivery
          cp "$APK" delivery/Namyran-Customer-Main-Candidate.apk
          cp "$FILE" delivery/BuildConfig.txt
          cp apk-identity.txt apk-signature.txt delivery/
          git rev-parse HEAD > delivery/COMMIT.txt
          sha256sum delivery/*.apk > delivery/SHA256SUMS.txt
      - name: Upload installable main candidate
        uses: actions/upload-artifact@v4
        with:
          name: Namyran-Customer-Main-Candidate
          path: delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-main-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
